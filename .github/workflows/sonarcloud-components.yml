name: SonarCloud component analysis
'on':
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sonar-components-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
    - name: Prepare analysis inputs
      id: prepare
      run: |-
        cd frontend
        npm ci
        npm run test
        cd "$GITHUB_WORKSPACE"
        cargo install cargo-llvm-cov --version 0.9.1 --locked
        cd services/backend
        mkdir -p target/sonar
        cargo llvm-cov --all-targets --lcov --output-path target/sonar/rust-lcov.info
        cargo clippy --all-targets --all-features --message-format=json -- -D warnings > target/sonar/rust-clippy.jsonl
        cd "$GITHUB_WORKSPACE"
        python3 scripts/sonar-rust-reports.py "$PWD" services/backend/target/sonar/rust-lcov.info services/backend/target/sonar/rust-clippy.jsonl
    - name: Analyze Repository aggregate
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      with:
        args: -Dproject.settings=sonar-project.properties
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
    - name: Analyze backend
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      with:
        args: -Dproject.settings=.sonar/backend.properties
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
    - name: Analyze frontend
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      with:
        args: -Dproject.settings=.sonar/frontend.properties
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
    env:
      DATABASE_URL: postgres://hotel_app:${{ github.run_id }}@localhost:5432/hotel_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hotel_app
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: hotel_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U hotel_app -d hotel_test" --health-interval 10s --health-timeout 5s --health-retries
          5
